{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <title>Sistema de Incidentes · Sectores</title>
    <link rel="icon" type="image/png" href="{% static 'img/log.png' %}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        body {
            background-color: #fff8d6;
            display: flex;
            min-height: 100vh;
            min-height: 100dvh;
        }

        /* ========== SIDEBAR ========== */
        .sidebar {
            width: 18vw;
            min-height: 100vh;
            min-height: 100dvh;
            background-color: #d71920;
            color: white;
            padding: 2vh 1.2vw;
            position: fixed;
            left: 0;
            top: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.2vh 0;
            margin-bottom: 2.5vh;
            width: 100%;
        }

        .logo img {
            width: 10vw;
            max-width: 120px;
            height: auto;
            aspect-ratio: 1/1;
            object-fit: contain;
        }

        .menu {
            list-style: none;
            width: 100%;
            margin-top: 1vh;
        }

        .menu li {
            margin-bottom: 1.2vh;
        }

        .menu a {
            display: block;
            padding: 1.8vh 1.2vw;
            color: white;
            text-decoration: none;
            font-size: clamp(0.8rem, 1.2vw, 1.2rem);
            font-weight: 600;
            border-radius: 0.8rem;
            transition: 0.2s ease;
            text-align: center;
            letter-spacing: 0.3px;
        }

        .menu a:hover,
        .menu a.active {
            background-color: #f5c400;
            color: #a80000;
        }

        /* ========== CONTENIDO PRINCIPAL ========== */
        .content {
            margin-left: 18vw;
            width: 82vw;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 4vh 4vw;
            display: flex;
            flex-direction: column;
        }

        /* ========== HEADER ========== */
        .header {
            background-color: white;
            border-left: 0.6vw solid #d71920;
            padding: 2.8vh 2.8vw;
            border-radius: 1.2rem;
            margin-bottom: 2.5vh;
            box-shadow: 0 0.4vh 1.6vh rgba(0, 0, 0, 0.08);
        }

        .header h1 {
            color: #d71920;
            font-size: clamp(1.6rem, 3.2vw, 3.6rem);
            margin-bottom: 0.6vh;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header p {
            color: #444;
            font-size: clamp(1rem, 1.4vw, 1.5rem);
        }

        /* ========== BARRA DE BÚSQUEDA ========== */
        .search-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8vw;
            background: white;
            padding: 1.6vh 2vw;
            border-radius: 1.2rem;
            box-shadow: 0 0.4vh 1.6vh rgba(0, 0, 0, 0.07);
            margin-bottom: 3vh;
            align-items: center;
            border-left: 0.4vw solid #f5c400;
        }

        .search-bar input {
            flex: 1 1 200px;
            padding: 1.2vh 1.2vw;
            border: 1.5px solid #e0d6b5;
            border-radius: 2rem;
            font-size: clamp(0.9rem, 1.2vw, 1.1rem);
            background: #fefcf3;
            outline: none;
            transition: 0.2s;
            min-width: 140px;
        }

        .search-bar input:focus {
            border-color: #d71920;
            background: white;
            box-shadow: 0 0 0 3px rgba(215, 25, 32, 0.1);
        }

        .search-bar button {
            background-color: #d71920;
            color: white;
            border: none;
            padding: 1.2vh 2.2vw;
            border-radius: 3rem;
            font-weight: 600;
            font-size: clamp(0.9rem, 1.1vw, 1.1rem);
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 0.4vw;
            white-space: nowrap;
            letter-spacing: 0.3px;
            box-shadow: 0 0.3vh 0.8vh rgba(215, 25, 32, 0.25);
        }

        .search-bar button:hover {
            background-color: #b01218;
            transform: scale(1.02);
        }

        /* ========== LISTADO DE SECTORES ========== */
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 1.8vh;
            flex: 1 1 auto;
        }

        .list-item {
            background-color: white;
            padding: 2.2vh 2.2vw;
            border-radius: 1.2rem;
            border-left: 0.5vw solid #f5c400;
            box-shadow: 0 0.4vh 1.6vh rgba(0, 0, 0, 0.07);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            transition: 0.15s ease;
        }

        .list-item:hover {
            box-shadow: 0 0.8vh 2.4vh rgba(0, 0, 0, 0.12);
            transform: scale(1.002);
        }

        .item-info {
            display: flex;
            flex-direction: column;
            gap: 0.2vh;
            flex: 1 1 180px;
        }

        .item-info .nombre {
            font-size: clamp(1.2rem, 1.8vw, 2rem);
            font-weight: 700;
            color: #1e1e1e;
            letter-spacing: -0.3px;
        }

        /* ===== BOTONES ===== */
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6vw;
            align-items: center;
            margin-top: 0.6vh;
        }

        .btn {
            border: none;
            padding: 0.5vh 1.2vw;
            border-radius: 2rem;
            font-weight: 600;
            font-size: clamp(0.7rem, 0.9vw, 0.95rem);
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
            background: #f0f0f0;
            color: #222;
        }

        .btn.visualizar {
            background: #1a5fb4;
            color: white;
        }

        .btn.visualizar:hover {
            background: #0e4a92;
            transform: scale(1.04);
        }

        .btn.eliminar {
            background: #b02b2b;
            color: white;
        }

        .btn.eliminar:hover {
            background: #8f1f1f;
            transform: scale(1.04);
        }

        /* ===== BOTÓN FLOTANTE "AGREGAR SECTOR" ===== */
        .btn-flotante {
            position: fixed;
            bottom: 2.5rem;
            right: 2.5rem;
            background-color: #1f8b4c;
            color: white;
            border: none;
            padding: 0.9rem 1.8rem;
            border-radius: 3rem;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 10px 25px rgba(31, 139, 76, 0.4);
            display: flex;
            align-items: center;
            gap: 0.7rem;
            cursor: pointer;
            transition: 0.2s ease;
            z-index: 999;
            border: 1px solid rgba(255, 255, 255, 0.2);
            letter-spacing: 0.4px;
        }

        .btn-flotante:hover {
            background-color: #146b3a;
            transform: scale(1.04);
            box-shadow: 0 14px 30px rgba(31, 139, 76, 0.5);
        }

        .btn-flotante i {
            font-size: 1.2rem;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 820px) {
            .sidebar {
                width: 22vw;
                padding: 2vh 1.6vw;
            }

            .content {
                margin-left: 22vw;
                width: 78vw;
                padding: 3vh 3vw;
            }

            .logo img {
                width: 12vw;
            }

            .menu a {
                font-size: clamp(0.7rem, 1.4vw, 1rem);
                padding: 1.6vh 0.8vw;
            }

            .list-item {
                padding: 2vh 2.4vw;
                border-left-width: 0.6vw;
            }

            .item-info .nombre {
                font-size: clamp(1rem, 2vw, 1.6rem);
            }

            .header h1 {
                font-size: clamp(1.4rem, 3.6vw, 2.6rem);
            }

            .actions {
                gap: 0.8vw;
            }

            .btn {
                padding: 0.4vh 1.6vw;
                font-size: clamp(0.65rem, 1vw, 0.9rem);
            }

            .search-bar {
                padding: 1.4vh 2.4vw;
            }

            .btn-flotante {
                bottom: 2rem;
                right: 2rem;
                padding: 0.8rem 1.5rem;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 600px) {
            .sidebar {
                width: 28vw;
                padding: 1.6vh 1.2vw;
            }

            .content {
                margin-left: 28vw;
                width: 72vw;
                padding: 2.4vh 2.8vw;
            }

            .logo img {
                width: 14vw;
                max-width: 80px;
            }

            .menu a {
                font-size: clamp(0.6rem, 1.8vw, 0.9rem);
                padding: 1.4vh 0.6vw;
                border-radius: 0.6rem;
            }

            .list-container {
                gap: 2vh;
            }

            .list-item {
                padding: 2vh 2.8vw;
                border-left-width: 0.8vw;
                flex-direction: column;
                align-items: flex-start;
                gap: 1.2vh;
            }

            .item-info .nombre {
                font-size: clamp(1.1rem, 4vw, 1.6rem);
            }

            .header {
                padding: 2vh 3vw;
                border-left-width: 1vw;
            }

            .header h1 {
                font-size: clamp(1.2rem, 4.5vw, 2rem);
            }

            .header p {
                font-size: clamp(0.8rem, 2vw, 1rem);
            }

            .search-bar {
                flex-direction: column;
                align-items: stretch;
                gap: 1.2vh;
                padding: 2vh 3vw;
            }

            .search-bar input {
                width: 100%;
                padding: 1.4vh 2vw;
            }

            .search-bar button {
                justify-content: center;
                padding: 1.4vh 2vw;
            }

            .actions {
                gap: 1.2vw;
                width: 100%;
            }

            .btn {
                padding: 0.6vh 3vw;
                font-size: clamp(0.7rem, 2vw, 0.9rem);
            }

            .btn-flotante {
                bottom: 1.5rem;
                right: 1.5rem;
                padding: 0.7rem 1.2rem;
                font-size: 0.85rem;
            }
        }

        @media (max-width: 400px) {
            .sidebar {
                width: 32vw;
                padding: 1.2vh 0.8vw;
            }

            .content {
                margin-left: 32vw;
                width: 68vw;
                padding: 2vh 2vw;
            }

            .menu a {
                font-size: clamp(0.5rem, 2vw, 0.75rem);
                padding: 1.2vh 0.4vw;
            }

            .logo img {
                width: 16vw;
            }

            .list-item {
                padding: 1.8vh 2.4vw;
            }

            .header h1 {
                font-size: clamp(1rem, 5vw, 1.6rem);
            }

            .btn {
                font-size: clamp(0.6rem, 2.2vw, 0.75rem);
                padding: 0.4vh 2.4vw;
            }

            .btn-flotante {
                bottom: 1rem;
                right: 1rem;
                padding: 0.5rem 1rem;
                font-size: 0.75rem;
            }
        }
    </style>
</head>

<body>

    <aside class="sidebar">
        <div class="logo">
            <img src="{% static 'img/log.png' %}" alt="Logo institucional">
        </div>
        <ul class="menu">
            <li><a href="inicio_m.html">Inicio</a></li>
            <li><a href="sectores_m.html" class="active">Sectores</a></li>
            <li><a href="encargados_m.html">Encargados</a></li>
            <li><a href="#">Incidentes</a></li>
            <li><a href="reportes_m.html">Reportes</a></li>
            <li><a href="configuracion_m.html">Configuración</a></li>
        </ul>
    </aside>

    <main class="content">
        <div class="header">
            <h1>Sectores</h1>
            <p>Gestión de sectores</p>
        </div>

        <!-- ===== BARRA DE BÚSQUEDA ===== -->
        <div class="search-bar">
            <input type="text" placeholder="Buscar sector ..." aria-label="Buscar sector">
            <button type="button">🔍 Buscar</button>
        </div>

        <!-- ===== LISTADO DE SECTORES ===== -->
        <div class="list-container">

            <!-- Sector Norte -->
            <div class="list-item">
                <div class="item-info">
                    <div class="nombre">Norte</div>
                </div>
                <div class="actions">
                    <button class="btn visualizar">👁️ Visualizar</button>
                    <button class="btn eliminar">✕ Eliminar sector</button>
                </div>
            </div>

            <!-- Sector Sur -->
            <div class="list-item">
                <div class="item-info">
                    <div class="nombre">Sur</div>
                </div>
                <div class="actions">
                    <button class="btn visualizar">👁️ Visualizar</button>
                    <button class="btn eliminar">✕ Eliminar sector</button>
                </div>
            </div>

            <!-- Sector Este -->
            <div class="list-item">
                <div class="item-info">
                    <div class="nombre">Este</div>
                </div>
                <div class="actions">
                    <button class="btn visualizar">👁️ Visualizar</button>
                    <button class="btn eliminar">✕ Eliminar sector</button>
                </div>
            </div>

            <!-- Sector Oeste -->
            <div class="list-item">
                <div class="item-info">
                    <div class="nombre">Oeste</div>
                </div>
                <div class="actions">
                    <button class="btn visualizar">👁️ Visualizar</button>
                    <button class="btn eliminar">✕ Eliminar sector</button>
                </div>
            </div>

            <!-- Sector Centro -->
            <div class="list-item">
                <div class="item-info">
                    <div class="nombre">Centro</div>
                </div>
                <div class="actions">
                    <button class="btn visualizar">👁️ Visualizar</button>
                    <button class="btn eliminar">✕ Eliminar sector</button>
                </div>
            </div>

            <!-- Sector Noroeste -->
            <div class="list-item">
                <div class="item-info">
                    <div class="nombre">Noroeste</div>
                </div>
                <div class="actions">
                    <button class="btn visualizar">👁️ Visualizar</button>
                    <button class="btn eliminar">✕ Eliminar sector</button>
                </div>
            </div>

        </div>
    </main>
    <button class="btn-flotante">Agregar sector</button>

</body>

</html>
