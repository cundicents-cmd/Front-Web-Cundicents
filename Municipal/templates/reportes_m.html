{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <title>Sistema de Incidentes · Reportes por Sector</title>
    <link rel="icon" type="image/png" href="{% static 'img/log.png' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        body {
            background-color: #fff8d6;
            display: flex;
            min-height: 100vh;
            min-height: 100dvh;
        }

        /* ========== SIDEBAR ========== */
        .sidebar {
            width: 18vw;
            min-height: 100vh;
            min-height: 100dvh;
            background-color: #d71920;
            color: white;
            padding: 2vh 1.2vw;
            position: fixed;
            left: 0;
            top: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.2vh 0;
            margin-bottom: 2.5vh;
            width: 100%;
        }

        .logo img {
            width: 10vw;
            max-width: 120px;
            height: auto;
            aspect-ratio: 1/1;
            object-fit: contain;
        }

        .menu {
            list-style: none;
            width: 100%;
            margin-top: 1vh;
        }

        .menu li {
            margin-bottom: 1.2vh;
        }

        .menu a {
            display: block;
            padding: 1.8vh 1.2vw;
            color: white;
            text-decoration: none;
            font-size: clamp(0.8rem, 1.2vw, 1.2rem);
            font-weight: 600;
            border-radius: 0.8rem;
            transition: 0.2s ease;
            text-align: center;
            letter-spacing: 0.3px;
        }

        .menu a:hover,
        .menu a.active {
            background-color: #f5c400;
            color: #a80000;
        }

        /* ========== CONTENIDO PRINCIPAL ========== */
        .content {
            margin-left: 18vw;
            width: 82vw;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 3vh 3vw 6vh 3vw;
            display: flex;
            flex-direction: column;
        }

        /* ===== FILTROS: combos + botón consultar ===== */
        .filters {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 1.2rem 1.5rem;
            background: white;
            padding: 1.8rem 2rem;
            border-radius: 1.2rem;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
            margin-bottom: 2rem;
            border: 1px solid #f0e6c5;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            flex: 1 0 150px;
            min-width: 130px;
        }

        .filter-group label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #5e4b2b;
        }

        .filter-group select {
            padding: 0.6rem 0.8rem;
            border-radius: 0.7rem;
            border: 1px solid #d6c9a8;
            background-color: #fefcf5;
            font-size: 0.9rem;
            font-weight: 500;
            color: #2c2416;
            outline: none;
            transition: 0.2s;
            width: 100%;
            cursor: pointer;
        }

        .filter-group select:focus {
            border-color: #d71920;
            box-shadow: 0 0 0 3px rgba(215, 25, 32, 0.15);
        }

        .btn-consultar {
            background-color: #1a5fb4;
            color: white;
            border: none;
            padding: 0.6rem 1.8rem;
            border-radius: 2rem;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 0.3px;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 3px 8px rgba(26, 95, 180, 0.25);
            height: fit-content;
            margin-bottom: 2px;
            white-space: nowrap;
        }

        .btn-consultar:hover {
            background-color: #0e4a92;
            transform: scale(1.02);
            box-shadow: 0 6px 14px rgba(26, 95, 180, 0.3);
        }

        .btn-consultar i {
            font-size: 0.9rem;
        }

        /* ===== TABLA DE INCIDENTES ===== */
        .incident-table-wrapper {
            background: white;
            border-radius: 1.2rem;
            padding: 1rem 0.5rem 0.5rem 0.5rem;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.04);
            border: 1px solid #f0e6c5;
            flex: 1;
            overflow-x: auto;
        }

        .incident-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .incident-table th {
            text-align: left;
            padding: 0.9rem 1rem;
            background-color: #faf3e0;
            color: #3f321e;
            font-weight: 600;
            border-bottom: 2px solid #e3d6b6;
        }

        .incident-table td {
            padding: 0.8rem 1rem;
            border-bottom: 1px solid #efe7d0;
            color: #2b2417;
            vertical-align: middle;
        }

        .incident-table tr:last-child td {
            border-bottom: none;
        }

        .incident-table tr:hover td {
            background-color: #fcf8ed;
        }

        .badge {
            background-color: #f5c400;
            color: #7a3f00;
            font-weight: 600;
            padding: 0.2rem 0.7rem;
            border-radius: 1.2rem;
            font-size: 0.7rem;
            display: inline-block;
        }

        /* Botón "Ver detalle" en cada fila */
        .btn-detalle {
            background-color: #e8e0cc;
            border: none;
            padding: 0.3rem 0.8rem;
            border-radius: 1.5rem;
            font-size: 0.7rem;
            font-weight: 600;
            color: #3d3220;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            white-space: nowrap;
        }

        .btn-detalle:hover {
            background-color: #d71920;
            color: white;
        }

        .btn-detalle i {
            font-size: 0.7rem;
        }

        /* ===== BOTÓN FLOTANTE "GENERAR REPORTE" ===== */
        .btn-flotante {
            position: fixed;
            bottom: 2.5rem;
            right: 2.5rem;
            background-color: #1f8b4c;
            color: white;
            border: none;
            padding: 0.9rem 1.8rem;
            border-radius: 3rem;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 10px 25px rgba(31, 139, 76, 0.4);
            display: flex;
            align-items: center;
            gap: 0.7rem;
            cursor: pointer;
            transition: 0.2s ease;
            z-index: 999;
            border: 1px solid rgba(255, 255, 255, 0.2);
            letter-spacing: 0.4px;
        }

        .btn-flotante:hover {
            background-color: #146b3a;
            transform: scale(1.04);
            box-shadow: 0 14px 30px rgba(31, 139, 76, 0.5);
        }

        .btn-flotante i {
            font-size: 1.2rem;
        }

        /* ===== MODAL / PANTALLA FLOTANTE ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(3px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1.5rem;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background: white;
            max-width: 550px;
            width: 100%;
            border-radius: 1.8rem;
            padding: 2rem 2.2rem;
            box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.3);
            position: relative;
            animation: modalFade 0.25s ease;
            border: 1px solid #f0e6c5;
        }

        @keyframes modalFade {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f0e6c5;
            padding-bottom: 1rem;
            margin-bottom: 1.2rem;
        }

        .modal-header h3 {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2c2416;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .modal-header h3 i {
            color: #d71920;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: #7a6a4a;
            transition: 0.2s;
            line-height: 1;
        }

        .modal-close:hover {
            color: #d71920;
            transform: rotate(90deg);
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .modal-item {
            display: flex;
            justify-content: space-between;
            padding: 0.4rem 0;
            border-bottom: 1px dashed #efe7d0;
        }

        .modal-item .label {
            font-weight: 600;
            color: #5e4b2b;
        }

        .modal-item .value {
            color: #1f1a10;
            text-align: right;
            max-width: 60%;
        }

        .modal-item .value .badge {
            font-size: 0.75rem;
        }

        .modal-footer {
            margin-top: 1.5rem;
            display: flex;
            justify-content: flex-end;
            gap: 0.8rem;
        }

        .modal-footer .btn-cerrar {
            background-color: #e8e0cc;
            border: none;
            padding: 0.5rem 1.8rem;
            border-radius: 2rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .modal-footer .btn-cerrar:hover {
            background-color: #d6c9a8;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 820px) {
            .sidebar {
                width: 22vw;
                padding: 2vh 1.6vw;
            }

            .content {
                margin-left: 22vw;
                width: 78vw;
                padding: 2.5vh 2.5vw 5vh 2.5vw;
            }

            .logo img {
                width: 12vw;
            }

            .menu a {
                font-size: clamp(0.7rem, 1.4vw, 1rem);
                padding: 1.6vh 0.8vw;
            }

            .filters {
                padding: 1.2rem 1.2rem;
                gap: 0.8rem 1rem;
            }

            .filter-group {
                flex: 1 0 120px;
                min-width: 100px;
            }

            .btn-consultar {
                padding: 0.5rem 1.2rem;
                font-size: 0.8rem;
            }

            .modal-card {
                max-width: 90%;
                padding: 1.5rem;
            }
        }

        @media (max-width: 600px) {
            .sidebar {
                width: 28vw;
                padding: 1.6vh 1.2vw;
            }

            .content {
                margin-left: 28vw;
                width: 72vw;
                padding: 2vh 2vw 5vh 2vw;
            }

            .logo img {
                width: 14vw;
                max-width: 80px;
            }

            .menu a {
                font-size: clamp(0.6rem, 1.8vw, 0.9rem);
                padding: 1.4vh 0.6vw;
                border-radius: 0.6rem;
            }

            .filters {
                flex-direction: column;
                align-items: stretch;
                gap: 0.8rem;
                padding: 1rem;
            }

            .filter-group {
                flex: unset;
                min-width: unset;
            }

            .btn-consultar {
                align-self: flex-start;
                margin-top: 0.2rem;
            }

            .btn-flotante {
                bottom: 1.5rem;
                right: 1.5rem;
                padding: 0.7rem 1.2rem;
                font-size: 0.85rem;
            }

            .btn-flotante i {
                font-size: 1rem;
            }

            .modal-card {
                padding: 1.2rem;
            }

            .modal-item {
                flex-direction: column;
                gap: 0.2rem;
            }

            .modal-item .value {
                text-align: left;
                max-width: 100%;
            }
        }

        @media (max-width: 400px) {
            .sidebar {
                width: 32vw;
                padding: 1.2vh 0.8vw;
            }

            .content {
                margin-left: 32vw;
                width: 68vw;
                padding: 1.5vh 1.5vw 4vh 1.5vw;
            }

            .menu a {
                font-size: clamp(0.5rem, 2vw, 0.75rem);
                padding: 1.2vh 0.4vw;
            }

            .logo img {
                width: 16vw;
            }

            .incident-table {
                font-size: 0.75rem;
            }

            .incident-table th,
            .incident-table td {
                padding: 0.5rem 0.4rem;
            }

            .btn-flotante {
                bottom: 1rem;
                right: 1rem;
                padding: 0.5rem 1rem;
                font-size: 0.75rem;
            }

            .modal-card {
                padding: 1rem;
            }
        }
    </style>
</head>

<body>
    <aside class="sidebar">
        <div class="logo">
            <img src="log.png" alt="Logo institucional">
        </div>
        <ul class="menu">
            <li><a href="inicio_m.html">Inicio</a></li>
            <li><a href="sectores_m.html">Sectores</a></li>
            <li><a href="encargados_m.html">Encargados</a></li>
            <li><a href="#">Incidentes</a></li>
            <li><a href="reportes_m.html" class="active">Reportes</a></li>
            <li><a href="configuracion_m.html">Configuración</a></li>
        </ul>
    </aside>

    <main class="content">
        <!-- FILTROS: 3 combos + botón Consultar (sin Municipio) -->
        <div class="filters">
            <div class="filter-group">
                <label for="sector"><i class="fas fa-map-pin" style="margin-right: 4px;"></i> Sector</label>
                <select id="sector">
                    <option value="todos">Todos</option>
                    <option value="centro">Centro</option>
                    <option value="norte">Norte</option>
                    <option value="sur">Sur</option>
                    <option value="oriente">Oriente</option>
                    <option value="occidente">Occidente</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="tipo-incidente"><i class="fas fa-exclamation-triangle" style="margin-right: 4px;"></i> Tipo
                    de incidente</label>
                <select id="tipo-incidente">
                    <option value="todos">Todos</option>
                    <option value="accidente vial">Accidente vial</option>
                    <option value="incendio">Incendio</option>
                    <option value="inundacion">Inundación</option>
                    <option value="derrumbe">Derrumbe</option>
                    <option value="robo">Robo</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="incidente"><i class="fas fa-clipboard-list" style="margin-right: 4px;"></i>
                    Incidente</label>
                <select id="incidente">
                    <option value="todos">Todos</option>
                    <option value="INC-001">INC-001: Choque múltiple</option>
                    <option value="INC-002">INC-002: Incendio estructural</option>
                    <option value="INC-003">INC-003: Desborde de quebrada</option>
                    <option value="INC-004">INC-004: Deslizamiento</option>
                    <option value="INC-005">INC-005: Hurto comercial</option>
                </select>
            </div>
            <button class="btn-consultar" id="consultarBtn">
                <i class="fas fa-search"></i> Consultar
            </button>
        </div>

        <!-- TABLA DE INCIDENTES -->
        <div class="incident-table-wrapper">
            <table class="incident-table" id="incidentTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Sector</th>
                        <th>Tipo</th>
                        <th>Incidente</th>
                        <th>Estado</th>
                        <th style="text-align:center;">Detalle</th>
                    </tr>
                </thead>
                <tbody id="incidentBody">
                    <!-- Los datos se renderizan con JS -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- BOTÓN FLOTANTE "Generar reporte" -->
    <button class="btn-flotante" id="generarReporteBtn">
        <i class="fas fa-file-pdf"></i> Generar reporte
    </button>

    <!-- ===== MODAL / PANTALLA FLOTANTE ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3><i class="fas fa-circle-info"></i> Detalle del incidente</h3>
                <button class="modal-close" id="modalCloseBtn">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Los datos se inyectan dinámicamente -->
            </div>
            <div class="modal-footer">
                <button class="btn-cerrar" id="modalCerrarBtn">Cerrar</button>
            </div>
        </div>
    </div>

    <script>
        (function () {
            // ----- DATOS DE INCIDENTES (sin municipio) -----
            const incidentes = [
                { id: 'INC-001', sector: 'Centro', tipo: 'Accidente vial', descripcion: 'Choque múltiple en Av. Oriental', estado: 'Activo', fecha: '2026-09-08', prioridad: 'Alta' },
                { id: 'INC-002', sector: 'Norte', tipo: 'Incendio', descripcion: 'Incendio estructural en calle 30', estado: 'En revisión', fecha: '2026-09-07', prioridad: 'Media' },
                { id: 'INC-003', sector: 'Sur', tipo: 'Inundación', descripcion: 'Desborde de quebrada La Zúñiga', estado: 'Atendido', fecha: '2026-09-06', prioridad: 'Alta' },
                { id: 'INC-004', sector: 'Oriente', tipo: 'Derrumbe', descripcion: 'Deslizamiento en la vía a Las Palmas', estado: 'Pendiente', fecha: '2026-09-05', prioridad: 'Crítica' },
                { id: 'INC-005', sector: 'Occidente', tipo: 'Robo', descripcion: 'Hurto comercial en centro comercial', estado: 'Activo', fecha: '2026-09-04', prioridad: 'Media' },
                { id: 'INC-006', sector: 'Norte', tipo: 'Accidente vial', descripcion: 'Colisión entre dos vehículos en autopista', estado: 'Cerrado', fecha: '2026-09-03', prioridad: 'Baja' },
                { id: 'INC-007', sector: 'Sur', tipo: 'Incendio', descripcion: 'Incendio forestal en lote baldío', estado: 'Activo', fecha: '2026-09-02', prioridad: 'Alta' },
                { id: 'INC-008', sector: 'Centro', tipo: 'Inundación', descripcion: 'Anegación en calle 10 con carrera 50', estado: 'En revisión', fecha: '2026-09-01', prioridad: 'Media' },
            ];

            // Referencias DOM
            const tbody = document.getElementById('incidentBody');
            const sectorSelect = document.getElementById('sector');
            const tipoSelect = document.getElementById('tipo-incidente');
            const incidenteSelect = document.getElementById('incidente');
            const consultarBtn = document.getElementById('consultarBtn');
            const generarBtn = document.getElementById('generarReporteBtn');

            // Modal
            const modalOverlay = document.getElementById('modalOverlay');
            const modalBody = document.getElementById('modalBody');
            const modalCloseBtn = document.getElementById('modalCloseBtn');
            const modalCerrarBtn = document.getElementById('modalCerrarBtn');

            // Función para abrir el modal con los datos de un incidente
            function abrirModal(incidente) {
                const estadoColor = incidente.estado === 'Activo' ? 'background:#e74c3c; color:white;' :
                    incidente.estado === 'En revisión' ? 'background:#f39c12; color:white;' :
                        incidente.estado === 'Atendido' ? 'background:#2ecc71; color:white;' :
                            incidente.estado === 'Pendiente' ? 'background:#e67e22; color:white;' :
                                incidente.estado === 'Cerrado' ? 'background:#7f8c8d; color:white;' :
                                    'background:#95a5a6; color:white;';

                const prioridadColor = incidente.prioridad === 'Crítica' ? 'background:#c0392b; color:white;' :
                    incidente.prioridad === 'Alta' ? 'background:#e67e22; color:white;' :
                        incidente.prioridad === 'Media' ? 'background:#f1c40f; color:#3d3220;' :
                            'background:#7f8c8d; color:white;';

                modalBody.innerHTML = `
                    <div class="modal-item"><span class="label">ID</span><span class="value"><strong>${incidente.id}</strong></span></div>
                    <div class="modal-item"><span class="label">Sector</span><span class="value">${incidente.sector}</span></div>
                    <div class="modal-item"><span class="label">Tipo</span><span class="value">${incidente.tipo}</span></div>
                    <div class="modal-item"><span class="label">Descripción</span><span class="value">${incidente.descripcion}</span></div>
                    <div class="modal-item"><span class="label">Fecha</span><span class="value">${incidente.fecha}</span></div>
                    <div class="modal-item"><span class="label">Prioridad</span><span class="value"><span class="badge" style="${prioridadColor} border-radius:1.2rem; padding:0.2rem 0.8rem; font-weight:600;">${incidente.prioridad}</span></span></div>
                    <div class="modal-item"><span class="label">Estado</span><span class="value"><span class="badge" style="${estadoColor} border-radius:1.2rem; padding:0.2rem 0.8rem; font-weight:600;">${incidente.estado}</span></span></div>
                `;
                modalOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            // Cerrar modal
            function cerrarModal() {
                modalOverlay.classList.remove('active');
                document.body.style.overflow = '';
            }

            modalCloseBtn.addEventListener('click', cerrarModal);
            modalCerrarBtn.addEventListener('click', cerrarModal);
            modalOverlay.addEventListener('click', function (e) {
                if (e.target === modalOverlay) cerrarModal();
            });
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') cerrarModal();
            });

            // Función para renderizar la tabla con filtros aplicados
            function renderIncidentes() {
                const sector = sectorSelect.value;
                const tipo = tipoSelect.value;
                const incidenteVal = incidenteSelect.value;

                const filtrados = incidentes.filter(inc => {
                    if (sector !== 'todos' && inc.sector.toLowerCase() !== sector.toLowerCase()) return false;
                    if (tipo !== 'todos' && inc.tipo.toLowerCase() !== tipo.toLowerCase()) return false;
                    if (incidenteVal !== 'todos') {
                        const matchId = inc.id.toLowerCase().includes(incidenteVal.toLowerCase());
                        const matchDesc = inc.descripcion.toLowerCase().includes(incidenteVal.toLowerCase());
                        if (!matchId && !matchDesc) return false;
                    }
                    return true;
                });

                if (filtrados.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="6" style="text-align:center; padding:2rem; color:#7a6a4a; font-weight:500;">
                                <i class="fas fa-info-circle" style="margin-right:6px;"></i> No se encontraron incidentes con los filtros seleccionados.
                            </td>
                        </tr>
                    `;
                    return;
                }

                let html = '';
                filtrados.forEach(inc => {
                    let estadoColor = '';
                    if (inc.estado === 'Activo') estadoColor = 'background:#e74c3c; color:white;';
                    else if (inc.estado === 'En revisión') estadoColor = 'background:#f39c12; color:white;';
                    else if (inc.estado === 'Atendido') estadoColor = 'background:#2ecc71; color:white;';
                    else if (inc.estado === 'Pendiente') estadoColor = 'background:#e67e22; color:white;';
                    else if (inc.estado === 'Cerrado') estadoColor = 'background:#7f8c8d; color:white;';
                    else estadoColor = 'background:#95a5a6; color:white;';

                    html += `
                        <tr>
                            <td><strong>${inc.id}</strong></td>
                            <td>${inc.sector}</td>
                            <td>${inc.tipo}</td>
                            <td>${inc.descripcion}</td>
                            <td><span class="badge" style="${estadoColor} border-radius:1.2rem; padding:0.2rem 0.8rem; font-weight:600;">${inc.estado}</span></td>
                            <td style="text-align:center;">
                                <button class="btn-detalle" data-id="${inc.id}">
                                    <i class="fas fa-eye"></i> Ver
                                </button>
                            </td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;

                document.querySelectorAll('.btn-detalle').forEach(btn => {
                    btn.addEventListener('click', function () {
                        const id = this.getAttribute('data-id');
                        const incidente = incidentes.find(inc => inc.id === id);
                        if (incidente) {
                            abrirModal(incidente);
                        }
                    });
                });
            }

            consultarBtn.addEventListener('click', renderIncidentes);

            [sectorSelect, tipoSelect, incidenteSelect].forEach(sel => {
                sel.addEventListener('change', renderIncidentes);
            });

            generarBtn.addEventListener('click', function () {
                const rows = tbody.querySelectorAll('tr');
                let count = 0;
                rows.forEach(row => {
                    if (row.cells && row.cells.length === 6) count++;
                });
                const msg = count > 0 ?
                    `✅ Generando reporte con ${count} incidente(s) visibles.` :
                    '⚠️ No hay incidentes para generar reporte.';
                alert(msg);
            });

            renderIncidentes();
        })();
    </script>
</body>

</html>
