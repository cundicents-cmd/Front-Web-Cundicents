{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Sistema de Incidentes · Reportes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" type="image/png" href="{% static 'img/log.png' %}">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        /* ======== ESTILOS ======== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        body {
            background-color: #fff8d6;
            display: flex;
            min-height: 100vh;
            min-height: 100dvh;
        }

        .sidebar {
            width: 18vw;
            min-height: 100vh;
            min-height: 100dvh;
            background-color: #d71920;
            color: white;
            padding: 2vh 1.2vw;
            position: fixed;
            left: 0;
            top: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.2vh 0;
            margin-bottom: 2.5vh;
            width: 100%;
        }

        .logo img {
            width: 10vw;
            max-width: 120px;
            height: auto;
            aspect-ratio: 1/1;
            object-fit: contain;
        }

        .menu {
            list-style: none;
            width: 100%;
            margin-top: 1vh;
        }

        .menu li {
            margin-bottom: 1.2vh;
        }

        .menu a {
            display: block;
            padding: 1.8vh 1.2vw;
            color: white;
            text-decoration: none;
            font-size: clamp(0.8rem, 1.2vw, 1.2rem);
            font-weight: 600;
            border-radius: 0.8rem;
            transition: 0.2s ease;
            text-align: center;
            letter-spacing: 0.3px;
        }

        .menu a:hover,
        .menu a.active {
            background-color: #f5c400;
            color: #a80000;
        }

        .content {
            margin-left: 18vw;
            width: 82vw;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 3vh 3vw 6vh 3vw;
            display: flex;
            flex-direction: column;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 1.2rem 1.5rem;
            background: white;
            padding: 1.8rem 2rem;
            border-radius: 1.2rem;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
            margin-bottom: 2rem;
            border: 1px solid #f0e6c5;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            flex: 1 0 150px;
            min-width: 130px;
        }

        .filter-group label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #5e4b2b;
        }

        .filter-group select {
            padding: 0.6rem 0.8rem;
            border-radius: 0.7rem;
            border: 1px solid #d6c9a8;
            background-color: #fefcf5;
            font-size: 0.9rem;
            font-weight: 500;
            color: #2c2416;
            outline: none;
            transition: 0.2s;
            width: 100%;
            cursor: pointer;
        }

        .filter-group select:focus {
            border-color: #d71920;
            box-shadow: 0 0 0 3px rgba(215, 25, 32, 0.15);
        }

        .btn-consultar {
            background-color: #1a5fb4;
            color: white;
            border: none;
            padding: 0.6rem 1.8rem;
            border-radius: 2rem;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 0.3px;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 3px 8px rgba(26, 95, 180, 0.25);
            height: fit-content;
            margin-bottom: 2px;
            white-space: nowrap;
        }

        .btn-consultar:hover {
            background-color: #0e4a92;
            transform: scale(1.02);
            box-shadow: 0 6px 14px rgba(26, 95, 180, 0.3);
        }

        .btn-consultar i {
            font-size: 0.9rem;
        }

        .incident-table-wrapper {
            background: white;
            border-radius: 1.2rem;
            padding: 1rem 0.5rem 0.5rem 0.5rem;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.04);
            border: 1px solid #f0e6c5;
            flex: 1;
            overflow-x: auto;
        }

        .incident-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .incident-table th {
            text-align: left;
            padding: 0.9rem 1rem;
            background-color: #faf3e0;
            color: #3f321e;
            font-weight: 600;
            border-bottom: 2px solid #e3d6b6;
        }

        .incident-table td {
            padding: 0.8rem 1rem;
            border-bottom: 1px solid #efe7d0;
            color: #2b2417;
            vertical-align: middle;
        }

        .incident-table tr:last-child td {
            border-bottom: none;
        }

        .incident-table tr:hover td {
            background-color: #fcf8ed;
        }

        .badge {
            background-color: #f5c400;
            color: #7a3f00;
            font-weight: 600;
            padding: 0.2rem 0.7rem;
            border-radius: 1.2rem;
            font-size: 0.7rem;
            display: inline-block;
        }

        .btn-detalle {
            background-color: #e8e0cc;
            border: none;
            padding: 0.3rem 0.8rem;
            border-radius: 1.5rem;
            font-size: 0.7rem;
            font-weight: 600;
            color: #3d3220;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            white-space: nowrap;
        }

        .btn-detalle:hover {
            background-color: #d71920;
            color: white;
        }

        .btn-detalle i {
            font-size: 0.7rem;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(3px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1.5rem;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background: white;
            max-width: 550px;
            width: 100%;
            border-radius: 1.8rem;
            padding: 2rem 2.2rem;
            box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.3);
            position: relative;
            animation: modalFade 0.25s ease;
            border: 1px solid #f0e6c5;
            max-height: 92vh;
            display: flex;
            flex-direction: column;
        }

        @keyframes modalFade {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f0e6c5;
            padding-bottom: 1rem;
            margin-bottom: 1.2rem;
        }

        .modal-header h3 {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2c2416;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .modal-header h3 i {
            color: #d71920;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: #7a6a4a;
            transition: 0.2s;
            line-height: 1;
        }

        .modal-close:hover {
            color: #d71920;
            transform: rotate(90deg);
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            overflow-y: auto;
            max-height: 66vh;
            padding-right: 0.35rem;
        }

        .modal-item {
            display: flex;
            justify-content: space-between;
            padding: 0.4rem 0;
            border-bottom: 1px dashed #efe7d0;
        }

        .modal-item .label {
            font-weight: 600;
            color: #5e4b2b;
        }

        .modal-item .value {
            color: #1f1a10;
            text-align: right;
            max-width: 60%;
            word-break: break-word;
        }

        .modal-item .value .badge {
            font-size: 0.75rem;
        }

        .modal-item--full {
            flex-direction: column;
            gap: 0.2rem;
        }

        .modal-item--full .value {
            text-align: left;
            max-width: 100%;
        }

        .modal-footer {
            margin-top: 1.5rem;
            display: flex;
            justify-content: flex-end;
            gap: 0.8rem;
        }

        .modal-footer .btn-cerrar {
            background-color: #e8e0cc;
            border: none;
            padding: 0.5rem 1.8rem;
            border-radius: 2rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .modal-footer .btn-cerrar:hover {
            background-color: #d6c9a8;
        }

        .modal-seccion {
            margin-top: 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .modal-seccion>.label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #5e4b2b;
        }

        .modal-mapa {
            width: 100%;
            height: 220px;
            border-radius: 0.9rem;
            border: 1px solid #e3d6b6;
            overflow: hidden;
            z-index: 0;
        }

        .modal-vacio {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            font-style: italic;
            color: #7a6a4a;
        }

        .evidencias-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 0.5rem;
        }

        .evidencia-item {
            display: block;
            aspect-ratio: 1 / 1;
            border-radius: 0.6rem;
            overflow: hidden;
            border: 1px solid #e3d6b6;
            background: #faf3e0;
        }

        .evidencia-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.2s ease;
        }

        .evidencia-item:hover img {
            transform: scale(1.06);
        }

        .evidencia-item.evidencia-rota {
            display: none;
        }

        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1200;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 0.6rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .lightbox-close {
            position: absolute;
            top: 1rem;
            right: 1.4rem;
            background: none;
            border: none;
            color: #fff;
            font-size: 2.2rem;
            line-height: 1;
            cursor: pointer;
        }

        @media (max-width: 820px) {
            .sidebar {
                width: 22vw;
                padding: 2vh 1.6vw;
            }

            .content {
                margin-left: 22vw;
                width: 78vw;
                padding: 2.5vh 2.5vw 5vh 2.5vw;
            }

            .logo img {
                width: 12vw;
            }

            .menu a {
                font-size: clamp(0.7rem, 1.4vw, 1rem);
                padding: 1.6vh 0.8vw;
            }

            .filters {
                padding: 1.2rem 1.2rem;
                gap: 0.8rem 1rem;
            }

            .filter-group {
                flex: 1 0 120px;
                min-width: 100px;
            }

            .btn-consultar {
                padding: 0.5rem 1.2rem;
                font-size: 0.8rem;
            }

            .modal-card {
                max-width: 90%;
                padding: 1.5rem;
            }
        }

        @media (max-width: 600px) {
            .sidebar {
                width: 28vw;
                padding: 1.6vh 1.2vw;
            }

            .content {
                margin-left: 28vw;
                width: 72vw;
                padding: 2vh 2vw 5vh 2vw;
            }

            .logo img {
                width: 14vw;
                max-width: 80px;
            }

            .menu a {
                font-size: clamp(0.6rem, 1.8vw, 0.9rem);
                padding: 1.4vh 0.6vw;
                border-radius: 0.6rem;
            }

            .filters {
                flex-direction: column;
                align-items: stretch;
                gap: 0.8rem;
                padding: 1rem;
            }

            .filter-group {
                flex: unset;
                min-width: unset;
            }

            .btn-consultar {
                align-self: flex-start;
                margin-top: 0.2rem;
            }

            .modal-card {
                padding: 1.2rem;
            }

            .modal-item {
                flex-direction: column;
                gap: 0.2rem;
            }

            .modal-item .value {
                text-align: left;
                max-width: 100%;
            }

            .modal-body {
                max-height: 62vh;
            }

            .modal-mapa {
                height: 180px;
            }
        }

        @media (max-width: 400px) {
            .sidebar {
                width: 32vw;
                padding: 1.2vh 0.8vw;
            }

            .content {
                margin-left: 32vw;
                width: 68vw;
                padding: 1.5vh 1.5vw 4vh 1.5vw;
            }

            .menu a {
                font-size: clamp(0.5rem, 2vw, 0.75rem);
                padding: 1.2vh 0.4vw;
            }

            .logo img {
                width: 16vw;
            }

            .incident-table {
                font-size: 0.75rem;
            }

            .incident-table th,
            .incident-table td {
                padding: 0.5rem 0.4rem;
            }

            .modal-card {
                padding: 1rem;
            }
        }
    </style>
</head>

<body>
    <aside class="sidebar">
        <div class="logo">
            <img src="{% static 'img/log.png' %}" alt="Logo institucional">
        </div>
        <ul class="menu">
            <li><a href="{% url 'Municipalidad'%}">Inicio</a></li>
            <li><a href="{% url 'Sectores'%}">Sectores</a></li>
            <li><a href="{% url 'Encargados'%}">Encargados</a></li>
            <li><a href="{% url 'Reportes-M'%}">Historial de incidentes</a></li>
            <li><a href="{% url 'Lista-Incidentes-M'%}" class="active">Reportes activos</a></li>
            <li><a href="{% url 'Actualizar-Usuario-M'%}">Perfil</a></li>
        </ul>
    </aside>

    <main class="content">
        <!-- FILTROS: 3 combos + botón Consultar (municipio lo aplica el backend) -->
        <div class="filters">
            <div class="filter-group">
                <label for="sector"><i class="fas fa-map-pin" style="margin-right: 4px;"></i> Sector</label>
                <select id="sector">
                    <option value="todos">Todos</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="prioridad"><i class="fas fa-exclamation-triangle" style="margin-right: 4px;"></i>
                    Prioridad</label>
                <select id="prioridad">
                    <option value="todos">Todos</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="incidente"><i class="fas fa-clipboard-list" style="margin-right: 4px;"></i>
                    Incidente</label>
                <select id="incidente">
                    <option value="todos">Todos</option>
                </select>
            </div>
            <button class="btn-consultar" id="consultarBtn">
                <i class="fas fa-search"></i> Consultar
            </button>
        </div>

        <div class="incident-table-wrapper">
            <table class="incident-table" id="incidentTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Sector</th>
                        <th>Prioridad</th>
                        <th>Incidente</th>
                        <th>Estado</th>
                        <th style="text-align:center;">Detalle</th>
                    </tr>
                </thead>
                <tbody id="incidentBody"></tbody>
            </table>
        </div>
    </main>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3><i class="fas fa-circle-info"></i> Detalle del incidente</h3>
                <button class="modal-close" id="modalCloseBtn">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer">
                <button class="btn-cerrar" id="modalCerrarBtn">Cerrar</button>
            </div>
        </div>
    </div>

    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightboxClose" type="button">&times;</button>
        <img src="" alt="Evidencia ampliada">
    </div>

    <script>
        window.REPORTES_CFG = {
            urlFiltros:    "{% url 'Incidentes-Filtros-A-M' %}",
            urlIncidentes: "{% url 'Reportes-Incidentes-A-M' %}",  /* JSON: api_incidentes_a */
            urlDetalle:    "{% url 'Reportes-Detalle-A-M' pk=0 %}"
        };
    </script>
    <script>
        (function () {
            'use strict';

            const CFG = window.REPORTES_CFG;
            const $ = (id) => document.getElementById(id);

            const selSector = $('sector');
            const selPrioridad = $('prioridad');
            const selIncidente = $('incidente');
            const btnConsultar = $('consultarBtn');
            const tbody = $('incidentBody');

            const modalOverlay = $('modalOverlay');
            const modalBody = $('modalBody');
            const modalCloseBtn = $('modalCloseBtn');
            const modalCerrarBtn = $('modalCerrarBtn');

            const lightbox = $('lightbox');
            const lightboxClose = $('lightboxClose');
            const lightboxImg = lightbox ? lightbox.querySelector('img') : null;

            let mapa = null;

            function esc(valor) {
                if (valor === null || valor === undefined) return '—';
                return String(valor).replace(/[&<>"']/g, function (c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
                });
            }
            function texto(valor) {
                if (valor === null || valor === undefined) return '—';
                const s = String(valor).trim();
                return s === '' ? '—' : s;
            }
            function colorEstado(estado) {
                const e = (estado || '').toLowerCase();
                if (e.indexOf('activ') !== -1) return 'background:#e74c3c;color:#fff;';
                if (e.indexOf('revis') !== -1) return 'background:#f39c12;color:#fff;';
                if (e.indexOf('atend') !== -1) return 'background:#2ecc71;color:#fff;';
                if (e.indexOf('pend') !== -1) return 'background:#e67e22;color:#fff;';
                if (e.indexOf('cerr') !== -1) return 'background:#7f8c8d;color:#fff;';
                return 'background:#95a5a6;color:#fff;';
            }
            function colorPrioridad(prioridad) {
                const p = (prioridad || '').toLowerCase();
                if (p.indexOf('crit') !== -1) return 'background:#c0392b;color:#fff;';
                if (p.indexOf('alt') !== -1) return 'background:#e67e22;color:#fff;';
                if (p.indexOf('med') !== -1) return 'background:#f1c40f;color:#3d3220;';
                if (p.indexOf('baj') !== -1) return 'background:#7f8c8d;color:#fff;';
                return 'background:#95a5a6;color:#fff;';
            }
            function fmtFecha(iso) {
                if (!iso) return '—';
                const d = new Date(iso);
                if (isNaN(d.getTime())) return iso;
                try {
                    return d.toLocaleString('es-CO', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
                } catch (e) { return d.toISOString(); }
            }
            async function pedirJSON(url) {
                const resp = await fetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' }, credentials: 'same-origin' });
                if (!resp.ok) throw new Error('el servidor respondió ' + resp.status);
                let data;
                try { data = await resp.json(); } catch (e) { throw new Error('la respuesta no es JSON válido'); }
                if (data && data.ok === false) throw new Error(data.error || 'error desconocido');
                return data;
            }
            function llenarSelect(select, valores) {
                while (select.options.length > 1) select.remove(1);
                (valores || []).forEach(function (valor) {
                    const opt = document.createElement('option');
                    opt.value = valor; opt.textContent = valor;
                    select.appendChild(opt);
                });
            }

            async function cargarFiltros() {
                try {
                    const data = await pedirJSON(CFG.urlFiltros);
                    llenarSelect(selSector, data.sectores);
                    llenarSelect(selPrioridad, data.prioridades);
                    llenarSelect(selIncidente, data.incidentes);
                } catch (err) {
                    console.error('Filtros:', err);
                    mostrarAvisoTabla('No se pudieron cargar los filtros (' + err.message + ').');
                }
            }

            function paramsFiltros() {
                const p = new URLSearchParams();
                if (selSector.value && selSector.value !== 'todos') p.set('sector', selSector.value);
                if (selPrioridad.value && selPrioridad.value !== 'todos') p.set('prioridad', selPrioridad.value);
                if (selIncidente.value && selIncidente.value !== 'todos') p.set('incidente', selIncidente.value);
                return p;
            }

            function mostrarAvisoTabla(mensaje) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:2rem;color:#7a6a4a;font-weight:500;">' +
                    '<i class="fas fa-info-circle" style="margin-right:6px;"></i> ' + esc(mensaje) + '</td></tr>';
            }

            function renderTabla(registros) {
                if (!registros || registros.length === 0) {
                    mostrarAvisoTabla('No se encontraron incidentes con los filtros seleccionados.');
                    return;
                }
                const frag = document.createDocumentFragment();
                registros.forEach(function (r) {
                    const tr = document.createElement('tr');
                    tr.innerHTML =
                        '<td><strong>' + esc(r.id) + '</strong></td>' +
                        '<td>' + esc(texto(r.sector)) + '</td>' +
                        '<td><span class="badge" style="' + colorPrioridad(r.prioridad) + 'border-radius:1.2rem;padding:0.2rem 0.8rem;font-weight:600;">' +
                        esc(texto(r.prioridad)) + '</span></td>' +
                        '<td>' + esc(texto(r.incidente)) + '</td>' +
                        '<td><span class="badge" style="' + colorEstado(r.estado) + 'border-radius:1.2rem;padding:0.2rem 0.8rem;font-weight:600;">' +
                        esc(texto(r.estado)) + '</span></td>' +
                        '<td style="text-align:center;">' +
                        '<button type="button" class="btn-detalle" data-id="' + esc(r.id) + '">' +
                        '<i class="fas fa-eye"></i> Ver</button></td>';
                    frag.appendChild(tr);
                });
                tbody.innerHTML = '';
                tbody.appendChild(frag);
            }

            async function cargarIncidentes() {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:2rem;color:#7a6a4a;">' +
                    '<i class="fas fa-spinner fa-spin"></i> Cargando registros…</td></tr>';
                try {
                    const query = paramsFiltros().toString();
                    const data = await pedirJSON(CFG.urlIncidentes + (query ? '?' + query : ''));
                    renderTabla(data.registros || []);
                } catch (err) {
                    console.error('Incidentes:', err);
                    mostrarAvisoTabla('Error al consultar los incidentes: ' + err.message);
                }
            }

            function cerrarModal() {
                modalOverlay.classList.remove('active');
                document.body.style.overflow = '';
                if (mapa) { try { mapa.remove(); } catch (e) { } mapa = null; }
            }

            function inicializarMapa(lat, lng) {
                const contenedor = $('modalMapa');
                if (!contenedor) return;
                if (typeof L === 'undefined') {
                    contenedor.innerHTML = '<p class="modal-vacio" style="padding:.6rem;">' +
                        '<i class="fas fa-triangle-exclamation"></i> No se pudo cargar el mapa.</p>';
                    return;
                }
                mapa = L.map(contenedor, { scrollWheelZoom: false }).setView([lat, lng], 16);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19, attribution: '&copy; OpenStreetMap'
                }).addTo(mapa);
                L.marker([lat, lng]).addTo(mapa).bindPopup('Ubicación del incidente').openPopup();
                setTimeout(function () { if (mapa) mapa.invalidateSize(); }, 250);
            }

            function abrirLightbox(src) {
                if (!lightbox || !lightboxImg) { window.open(src, '_blank', 'noopener'); return; }
                lightboxImg.src = src;
                lightbox.classList.add('active');
            }
            function cerrarLightbox() {
                if (!lightbox) return;
                lightbox.classList.remove('active');
                if (lightboxImg) lightboxImg.src = '';
            }

            function pintarDetalle(r) {
                if (mapa) { try { mapa.remove(); } catch (e) { } mapa = null; }

                const filas = [
                    ['ID', esc(r.id)],
                    ['Usuario', esc(texto(r.usuario))],
                    ['Sector', esc(texto(r.sector))],
                    ['Incidente', esc(texto(r.incidente))],
                    ['Prioridad', '<span class="badge" style="border-radius:1.2rem;padding:0.2rem 0.8rem;font-weight:600;' + colorPrioridad(r.prioridad) + '">' + esc(texto(r.prioridad)) + '</span>'],
                    ['Estado', '<span class="badge" style="border-radius:1.2rem;padding:0.2rem 0.8rem;font-weight:600;' + colorEstado(r.estado) + '">' + esc(texto(r.estado)) + '</span>'],
                    ['Fecha y hora', esc(fmtFecha(r.fecha_hora))]
                ];

                let html = filas.map(function (f) {
                    return '<div class="modal-item"><span class="label">' + f[0] + '</span><span class="value">' + f[1] + '</span></div>';
                }).join('');

                html += '<div class="modal-item modal-item--full"><span class="label">Descripción</span>' +
                    '<span class="value">' + esc(texto(r.descripcion)) + '</span></div>';

                const tieneCoords = (r.lat !== null && r.lat !== undefined && r.lng !== null && r.lng !== undefined);
                html += '<div class="modal-seccion"><span class="label">Ubicación</span>';
                html += tieneCoords
                    ? '<div id="modalMapa" class="modal-mapa"></div>'
                    : '<p class="modal-vacio"><i class="fas fa-location-dot"></i> Este registro no tiene coordenadas válidas registradas.</p>';
                html += '</div>';

                const evidencias = Array.isArray(r.evidencias) ? r.evidencias : [];
                html += '<div class="modal-seccion"><span class="label">Evidencias</span>';
                if (evidencias.length) {
                    html += '<div class="evidencias-grid">';
                    evidencias.forEach(function (src, i) {
                        html += '<a href="' + esc(src) + '" class="evidencia-item" data-src="' + esc(src) + '" target="_blank" rel="noopener">' +
                            '<img src="' + esc(src) + '" alt="Evidencia ' + (i + 1) + '" loading="lazy"></a>';
                    });
                    html += '</div>';
                } else {
                    html += '<p class="modal-vacio"><i class="fas fa-image"></i> No hay imágenes disponibles para este incidente.</p>';
                }
                html += '</div>';

                modalBody.innerHTML = html;

                modalBody.querySelectorAll('.evidencia-item img').forEach(function (img) {
                    img.addEventListener('error', function () {
                        const enlace = this.closest('.evidencia-item');
                        if (enlace) enlace.classList.add('evidencia-rota');
                    });
                });
                modalBody.querySelectorAll('.evidencia-item').forEach(function (enlace) {
                    enlace.addEventListener('click', function (ev) {
                        ev.preventDefault();
                        abrirLightbox(this.getAttribute('data-src'));
                    });
                });

                if (tieneCoords) {
                    requestAnimationFrame(function () {
                        inicializarMapa(Number(r.lat), Number(r.lng));
                    });
                }
            }

            async function abrirDetalle(id) {
                modalBody.innerHTML = '<p style="padding:1rem;text-align:center;color:#7a6a4a;">' +
                    '<i class="fas fa-spinner fa-spin"></i> Cargando información…</p>';
                modalOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';
                try {
                    const url = CFG.urlDetalle.replace(/0\/$/, encodeURIComponent(id) + '/');
                    const data = await pedirJSON(url);
                    pintarDetalle(data.registro);
                } catch (err) {
                    console.error('Detalle:', err);
                    modalBody.innerHTML = '<p style="padding:1rem;color:#c0392b;">' +
                        '<i class="fas fa-circle-exclamation"></i> No se pudo cargar el detalle: ' + esc(err.message) + '</p>';
                }
            }

            /* -------- EVENTOS -------- */
            tbody.addEventListener('click', function (ev) {
                const boton = ev.target.closest('.btn-detalle');
                if (!boton) return;
                abrirDetalle(boton.getAttribute('data-id'));
            });

            btnConsultar.addEventListener('click', cargarIncidentes);

            [selSector, selPrioridad, selIncidente].forEach(function (sel) {
                sel.addEventListener('change', cargarIncidentes);
            });

            modalCloseBtn.addEventListener('click', cerrarModal);
            modalCerrarBtn.addEventListener('click', cerrarModal);
            modalOverlay.addEventListener('click', function (ev) {
                if (ev.target === modalOverlay) cerrarModal();
            });

            if (lightbox) {
                lightbox.addEventListener('click', function (ev) {
                    if (ev.target === lightbox || ev.target === lightboxClose) cerrarLightbox();
                });
                if (lightboxClose) lightboxClose.addEventListener('click', cerrarLightbox);
            }

            document.addEventListener('keydown', function (ev) {
                if (ev.key === 'Escape') {
                    if (lightbox && lightbox.classList.contains('active')) cerrarLightbox();
                    else if (modalOverlay.classList.contains('active')) cerrarModal();
                }
            });

            (async function init() {
                await cargarFiltros();
                await cargarIncidentes();
            })();
        })();
    </script>
</body>

</html>
